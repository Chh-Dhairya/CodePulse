[project]
name = "codepulse"
version = "0.1.0"
description = "Semantic Codebase Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API & Web Framework
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.7.0,<2.8.0",
    # Phase 7.5 (roadmap §37 item 7.5 "CI hook"): removed the previously
    # declared `pydantic-settings>=2.3.0,<2.4.0` line -- confirmed by
    # grep, nothing in `codepulse/` or `tests/` has EVER imported
    # `pydantic_settings` (this project's own `config.py` uses plain
    # `pydantic.BaseModel`, not `pydantic_settings.BaseSettings`; likely
    # a vestigial early-scaffold declaration). It also directly
    # conflicted with `mcp`'s (Phase 5.3, a REAL, used dependency) own
    # real requirement of `pydantic-settings>=2.5.2`, making
    # `pip install -e .` unresolvable -- discovered only once the
    # unrelated package-discovery error (fixed just above, via
    # `[tool.setuptools.packages.find]`) stopped masking it. `mcp`
    # already declares its own correct `pydantic-settings` requirement
    # as ITS OWN transitive dependency; codepulse does not need to
    # declare one at all.

    # Storage (Phase 0 local-first: SQLite via SQLAlchemy + Alembic; Postgres/
    # pgvector are server-mode-only per the roadmap's storage design (§7) and
    # are not used by any code yet -- removed in Phase 0.9's dependency trim,
    # to be re-added only when Phase 7's Postgres storage backend is built)
    "sqlalchemy>=2.0.30,<2.1.0",
    "alembic>=1.13.1,<1.14.0",

    # Embedded Keyword Search -- wired in as of Phase 2.1 (the Tantivy-backed
    # `BM25Index` lexical index adapter, codepulse/search/bm25.py). Kept
    # since the Phase 0.9 dependency trim's explicit decision ("keep
    # tantivy, finally use it").
    "tantivy>=0.22.0,<0.23.0",

    # Embedded Vector Search -- new in Phase 2.2 (the sqlite-vec-backed
    # `VectorIndex` semantic index adapter, codepulse/search/vector.py).
    # Roadmap §7 names two candidate local vector-index libraries,
    # `sqlite-vec` or `hnswlib`, without choosing between them; `hnswlib`
    # has no prebuilt wheel for this project's actual Windows/CPython 3.11
    # development platform (source-only on PyPI, requires an MSVC C++
    # compiler not installed here), so `sqlite-vec` -- which does have a
    # prebuilt win_amd64 wheel -- was used instead (disclosed in full in
    # codepulse/search/vector.py's module docstring and
    # CODEPULSE_PROGRESS.md's Phase 2.2 section).
    "sqlite-vec>=0.1.9,<0.2.0",

    # Code Parsing & AST (Bundled, zero-compile)
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.10.2",

    # File Discovery (.gitignore / .codepulseignore pattern matching, Phase 0.8)
    "pathspec>=1.1.0,<1.2.0",

    # Graph Analysis -- Phase 4.3 (roadmap §37 item 4.3: "Deterministic
    # module-clustering via import graph"). Used for seeded Louvain
    # community detection over the file-level import graph
    # (`codepulse/parser/module_graph.py`). Already installed in this
    # environment as `torch`'s own transitive dependency, but declared
    # here explicitly rather than relied on implicitly -- this project's
    # code now directly imports it, and a future `torch` version could
    # drop or change that transitive requirement.
    "networkx>=3.0,<4.0",

    # MCP Server -- Phase 5.3 (roadmap §37 item 5.3; §13 MCP Strategy:
    # "yes, expose an MCP server -- but strictly as an adapter").
    # `codepulse/mcp_server.py` uses the official SDK's `FastMCP`
    # server class; every tool it registers calls straight into
    # `IndexingEngine`, no parallel implementation.
    "mcp>=1.9.0,<2.0.0",

    # AI / Embeddings
    "sentence-transformers>=3.0.0,<3.1.0",
    "torch>=2.3.0,<2.4.0",

    # CLI Output (Phase 0.9: cli.py has always used Rich, but it was never
    # actually declared -- it only worked because something else happened to
    # pull it in transitively. Declaring it explicitly here is this
    # milestone's fix; no new CLI integration was added.)
    "rich>=15.0.0,<16.0.0",

    # Utilities & Monitoring -- declared but not yet wired in (Phase 7
    # activates structlog/prometheus-client for real observability); httpx is
    # a genuine transitive requirement of FastAPI's TestClient today. Neither
    # is in the roadmap's explicit Phase 0.9 removal list (only redis,
    # pgvector, and psycopg[binary] are), so left untouched here.
    "prometheus-client>=0.20.0,<0.21.0",
    "httpx>=0.27.0,<0.28.0",
    "structlog>=24.1.0,<24.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Phase 7.5 (roadmap §37 item 7.5 "CI hook for commit-triggered
# incremental indexing"): a real, working `pip install -e .` is a
# genuine prerequisite for any CI runner to do anything at all with
# this project. Fixes a real, previously-disclosed packaging gap
# (Phase 2.1's own finding, unfixed since): setuptools' automatic
# package discovery finds TWO top-level packages at the repo root
# (`alembic`, `codepulse`) and refuses to guess which to install,
# so `pip install -e .` has failed outright since Phase 2.1. Explicit
# `include` limits discovery to the one real installable package --
# `alembic/` is this project's OWN migration script directory (run via
# `alembic upgrade head`, never imported as a library), not a package
# meant to be installed.
[tool.setuptools.packages.find]
include = ["codepulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
